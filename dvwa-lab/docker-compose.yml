version: '3'
services:
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    ports:
      - "80:80"
    environment:
      - DB_SERVER=db
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=p@ssw0rd
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    restart: always